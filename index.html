<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b09">
<title>Lime Company | Presentación</title>
<meta name="description" content="La estrategia de 487, explicada para que la entiendas a la primera. Agenda tu activación acompañada.">
<meta property="og:title" content="La estrategia de 487, explicada a la primera">
<meta property="og:description" content="Entiéndela en menos de 5 minutos y agenda tu activación acompañada.">
<meta property="og:image" content="assets/hero.webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: guided conversation — one chat column, messages arrive one by one, replies are big tappable chips */
:root{--bg:#070a08;--bubble:#121a13;--bubble2:#172117;--ink:#f1f4ee;--muted:#b4c1b2;--dim:#7f8c7d;--lime:#9ef01a;--lime-d:#6cc20a;--mint:#7fd3a8;--stroke:rgba(158,240,26,.16);
--display:'Manrope',system-ui,sans-serif;--body:'DM Sans',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse 70% 40% at 85% 0%,rgba(158,240,26,.09),transparent 70%),radial-gradient(ellipse 60% 35% at 0% 100%,rgba(158,240,26,.05),transparent 70%);pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.app{position:fixed;inset:0;display:flex;flex-direction:column}

/* header */
.head{position:relative;z-index:5;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left));background:rgba(9,13,10,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.06)}
.av{flex:none;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e9ffc9,var(--lime) 55%,#3f7a07);display:grid;place-items:center;font:800 11px var(--display);letter-spacing:.02em;color:#0b1306;position:relative}
.av::after{content:"";position:absolute;right:0;bottom:1px;width:11px;height:11px;border-radius:50%;background:#3ddc84;border:2px solid #0a0e0b}
.who{flex:1;min-width:0}
.who strong{display:block;font:800 15px var(--display);letter-spacing:-.02em}
.who small{display:block;font-size:12px;color:var(--mint)}
.restart{border:1px solid var(--stroke);background:transparent;border-radius:10px;padding:7px 10px;font:700 11px var(--display);letter-spacing:.08em;color:var(--muted)}
.prog{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:transparent}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lime-d),var(--lime));box-shadow:0 0 10px rgba(158,240,26,.6);transition:width .7s cubic-bezier(.2,.8,.2,1)}

/* chat */
.chat{flex:1;min-height:0;overflow-y:auto;scroll-behavior:smooth;padding:18px max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left))}
.col{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-bottom:12px}
.day{align-self:center;font:700 10px var(--display);letter-spacing:.18em;color:var(--dim);background:rgba(255,255,255,.04);border-radius:20px;padding:5px 12px;margin:0 0 6px}
.msg{max-width:86%;padding:12px 15px;border-radius:18px;font-size:16px;line-height:1.5;animation:pop .38s cubic-bezier(.2,.9,.3,1.2) both;overflow-wrap:anywhere}
.msg.bot{align-self:flex-start;background:var(--bubble);border:1px solid rgba(255,255,255,.06);border-top-left-radius:6px}
.msg.bot b{color:var(--lime);font-weight:700}
.msg.user{align-self:flex-end;background:linear-gradient(180deg,#befa55,var(--lime));color:#0b1306;font-weight:600;border-top-right-radius:6px}
.msg.wide{max-width:100%;width:100%;padding:14px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.typing{align-self:flex-start;background:var(--bubble);border:1px solid rgba(255,255,255,.06);border-radius:18px;border-top-left-radius:6px;padding:14px 16px;display:flex;gap:5px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-4px);opacity:1}}

/* reply dock */
.dock{position:relative;z-index:5;padding:10px max(14px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));background:linear-gradient(0deg,rgba(7,10,8,.98) 60%,rgba(7,10,8,0));min-height:12px}
.dock .col{gap:9px;padding:0}
.choice{width:100%;min-height:56px;border-radius:16px;border:1px solid transparent;font:800 16px var(--display);letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;gap:10px;animation:pop .35s ease both;transition:transform .15s}
.choice:active{transform:scale(.98)}
.choice.main{background:linear-gradient(180deg,#c6ff5c,var(--lime) 55%,#86d81a);color:#0b1306;box-shadow:0 7px 0 #3f7a07,0 14px 30px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.5)}
.choice.main:active{transform:translateY(4px);box-shadow:0 3px 0 #3f7a07,inset 0 2px 0 rgba(255,255,255,.5)}
.choice.alt{background:rgba(18,26,19,.9);border-color:var(--stroke);color:var(--ink)}
.choice[disabled]{opacity:.45;pointer-events:none}
.namebox{display:flex;gap:8px}
.namebox input{flex:1;min-width:0;min-height:56px;border-radius:16px;border:1px solid #3f4d3b;background:#0b110b;color:#fff;padding:0 16px;font:500 17px var(--body);outline:none}
.namebox input:focus{border-color:var(--lime);box-shadow:0 0 0 4px rgba(158,240,26,.12)}
.namebox button{flex:none;width:56px;min-height:56px;border-radius:16px;border:0;background:var(--lime);color:#0b1306;display:grid;place-items:center}

/* widgets */
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.trust div{background:var(--bubble2);border:1px solid var(--stroke);border-radius:14px;padding:12px 8px;text-align:center}
.trust b{display:block;font:800 19px/1.1 var(--display);color:var(--lime);letter-spacing:-.03em}
.trust small{display:block;font:600 10px/1.3 var(--display);letter-spacing:.06em;color:var(--muted);margin-top:4px;text-transform:uppercase}
.cards{display:flex;flex-direction:column;gap:9px}
.card{position:relative;border-radius:18px;border:1px solid var(--stroke);background:linear-gradient(160deg,#182218,#0e140f);overflow:hidden;text-align:left;width:100%;padding:0;transition:border-color .3s,opacity .3s}
.card[disabled]{opacity:.38}
.card .ch{display:flex;align-items:center;gap:12px;padding:15px 16px}
.card .num{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:800 14px var(--display);background:rgba(158,240,26,.1);border:1px solid rgba(158,240,26,.35);color:var(--lime)}
.card .ct{flex:1;font:800 16px/1.25 var(--display);letter-spacing:-.02em}
.card .tap{font:800 10px var(--display);letter-spacing:.14em;color:#0b1306;background:var(--lime);border-radius:20px;padding:6px 10px;animation:breathe 1.6s ease-in-out infinite}
.card[disabled] .tap{animation:none;background:#2a352a;color:var(--dim)}
@keyframes breathe{50%{transform:scale(1.07)}}
.card .cb{display:none;padding:0 16px 16px}
.card.open{border-color:var(--lime)}
.card.open .cb{display:block;animation:pop .45s ease both}
.card.open .tap{display:none}
.card.open .num{background:var(--lime);color:#0b1306}
.card p{margin:12px 0 0;font-size:14.5px;line-height:1.55;color:#dbe4d6}
.card p b{color:var(--lime)}
/* card 1: table */
.tbl{display:grid;gap:6px;background:#0b110b;border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:10px}
.tbl .row{height:34px;border-radius:9px;border:1px dashed rgba(158,240,26,.3);display:flex;align-items:center;padding:0 12px;font:600 12px var(--display);color:var(--dim)}
.tbl .row.sub{margin-left:26px}
.card.open .tbl .row{animation:fill .45s ease forwards}
@keyframes fill{to{background:linear-gradient(90deg,#26421b,#172a12);border:1px solid var(--lime);color:#e9f5dc}}
.card.open .tbl .row.sub{animation-name:fillm}
@keyframes fillm{to{background:linear-gradient(90deg,#173328,#11231b);border:1px solid var(--mint);color:#e3fff1}}
.lvlup{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;font:800 13px var(--display);letter-spacing:.12em;color:var(--lime);opacity:0}
.card.open .lvlup{animation:pop .5s 3s ease forwards}
/* card 2: gifts */
.gifts{display:flex;flex-wrap:wrap;gap:7px;background:#0b110b;border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:12px;justify-content:center}
.gift{width:30px;height:30px;border-radius:7px;position:relative;background:linear-gradient(145deg,#e6ffbf,#a6de56 45%,#6c9f2f);box-shadow:0 4px 0 #3f5f1b;opacity:0;transform:translateY(-14px) scale(.4)}
.gift::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;background:#2f5a14}
.gift::after{content:"";position:absolute;top:9px;left:0;right:0;height:5px;background:#2f5a14}
.card.open .gift{animation:drop .45s cubic-bezier(.2,.9,.3,1.3) forwards}
@keyframes drop{to{opacity:1;transform:none}}
/* card 3: stairs */
.stairs{display:flex;align-items:flex-end;gap:5px;height:130px;background:#0b110b;border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:12px 12px 10px;position:relative}
.stairs .s{flex:1;border-radius:6px 6px 3px 3px;background:#1f2b1e;position:relative;height:0;display:flex;align-items:flex-start;justify-content:center;font:800 10px var(--display);color:#0b1306;padding-top:4px}
.card.open .stairs .s{animation:grow .6s cubic-bezier(.2,.9,.3,1.1) forwards}
@keyframes grow{to{height:var(--h);background:var(--c)}}
.stairs .flag{position:absolute;top:-6px;font:800 9px var(--display);letter-spacing:.08em;background:var(--lime);color:#0b1306;padding:3px 6px;border-radius:5px;opacity:0;white-space:nowrap}
.card.open .stairs .flag{animation:pop .4s ease forwards}
/* video */
.vwrap{position:relative;width:100%;max-width:330px;aspect-ratio:9/16;margin:0 auto;border-radius:18px;overflow:hidden;background:#000;border:1px solid var(--stroke)}
.vwrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.play{position:absolute;inset:0;border:0;background:radial-gradient(circle,rgba(8,11,9,.05),rgba(8,11,9,.55));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .3s}
.play.hide{opacity:0;pointer-events:none}
.play .disc{width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f2ffdc,var(--lime) 55%,#5e9425);display:grid;place-items:center;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(158,240,26,.45)}70%{box-shadow:0 0 0 22px rgba(158,240,26,0)}100%{box-shadow:0 0 0 0 rgba(158,240,26,0)}}
.play span{font:800 11px var(--display);letter-spacing:.14em;text-shadow:0 2px 10px #000}
.vbar{position:absolute;left:12px;right:12px;bottom:10px;height:4px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}.vbar i{display:block;height:100%;width:0;background:var(--lime)}
.vcap{text-align:center;font:600 12px var(--display);color:var(--dim);margin-top:8px}
/* plan */
.plan{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:12px;align-items:flex-start;background:var(--bubble2);border:1px solid var(--stroke);border-radius:15px;padding:13px 14px}
.step .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--lime);color:#0b1306;display:grid;place-items:center;font:800 14px var(--display)}
.step strong{display:block;font:800 15px var(--display);letter-spacing:-.02em}
.step small{display:block;font-size:13px;color:var(--muted);margin-top:2px;line-height:1.45}
.step em{font-style:normal;color:var(--mint);font-weight:600}
/* faq */
.faq details{border-bottom:1px solid rgba(255,255,255,.07);padding:12px 2px}
.faq details:last-child{border-bottom:0}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:12px;font:800 14.5px/1.35 var(--display)}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--lime);font-size:20px;line-height:1;font-weight:400}
.faq details[open] summary::after{content:"−"}
.faq p{margin:8px 0 0;font-size:14px;line-height:1.55;color:#cfd9ca}
.faq p b{color:var(--lime)}
/* scheduler */
.sch h4{margin:0 0 8px;font:800 11px var(--display);letter-spacing:.16em;color:var(--dim)}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:14px}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opt{min-height:52px;border-radius:13px;border:1px solid var(--stroke);background:#0d140d;font:800 14px var(--display);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:all .2s}
.opt small{font:600 10px var(--body);color:var(--dim)}
.opt.on{background:var(--lime);color:#0b1306;border-color:var(--lime);box-shadow:0 0 20px rgba(158,240,26,.3)}
.opt.on small{color:#2c4512}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border-radius:16px;font:800 16px var(--display);text-decoration:none;background:linear-gradient(180deg,#c6ff5c,var(--lime) 55%,#86d81a);color:#0b1306;box-shadow:0 7px 0 #3f7a07,0 14px 30px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.5);transition:opacity .2s}
.cta.off{opacity:.4;pointer-events:none;box-shadow:none}
.cta.ghost{background:#0d140d;color:var(--ink);border:1px solid var(--stroke);box-shadow:none;min-height:52px;font-size:15px}
.seat{display:flex;align-items:center;gap:8px;justify-content:center;font:700 12px var(--display);color:var(--muted);margin-top:10px}
.seat i{width:8px;height:8px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 0 rgba(61,220,132,.6);animation:ping 1.6s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
/* done */
.ok{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.ok .m{flex:none;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f2ffdc,var(--lime) 55%,#5e9425);display:grid;place-items:center;box-shadow:0 0 30px rgba(158,240,26,.4)}
.ok strong{font:800 18px/1.2 var(--display);letter-spacing:-.02em}
.prep{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.prep li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;color:#dbe4d6}
.prep li::before{content:"✓";flex:none;width:20px;height:20px;border-radius:50%;background:rgba(158,240,26,.14);color:var(--lime);display:grid;place-items:center;font:800 11px var(--display);margin-top:1px}
.legal{align-self:stretch;font-size:11px;line-height:1.6;color:var(--dim);margin:10px 4px 0;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.gift,.lvlup,.stairs .flag{opacity:1;transform:none}.stairs .s{height:var(--h);background:var(--c)}}
.journey{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:2px 0}
.journey div{border:1px solid var(--stroke);border-radius:12px;padding:9px 6px;text-align:center;background:rgba(255,255,255,.02)}
.journey b{display:block;font:800 18px var(--display);color:var(--dim)}
.journey small{display:block;font-size:11px;line-height:1.25;color:var(--muted);overflow-wrap:normal;word-break:normal;hyphens:none}
.journey .on{border-color:var(--lime);background:rgba(158,240,26,.1)}.journey .on b{color:var(--lime)}
.journey .ok b{color:var(--mint)}.journey .ok{border-color:rgba(127,211,168,.4)}
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <div class="av" aria-hidden="true">LIME</div>
    <div class="who"><strong>Comunidad AUREX · Lime</strong><small id="status">en línea</small></div>
    <button class="restart" id="restart" type="button">REINICIAR</button>
    <div class="prog"><i id="prog"></i></div>
  </header>
  <main class="chat" id="chat" aria-live="polite"><div class="col" id="col"><div class="day">HOY</div></div></main>
  <footer class="dock"><div class="col" id="dock"></div></footer>
</div>

<script>
(()=>{'use strict';
  // NÚMERO PREDETERMINADO (enlace general sin ?wa=)
  const DEFAULT_WHATSAPP='529871412185';
  const raw=(new URLSearchParams(location.search).get('wa')||'').replace(/\D/g,'');
  const WA=/^[1-9]\d{7,14}$/.test(raw)?raw:DEFAULT_WHATSAPP;
  const $=id=>document.getElementById(id);
  const col=$('col'),dock=$('dock'),chat=$('chat');
  const store={get(k){try{return localStorage.getItem(k)||''}catch(e){return ''}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  let name=store.get('lime_name');
  const wa=t=>'https://wa.me/'+WA+'?text='+encodeURIComponent(t);
  const hi=()=>name?('Hola, soy '+name+'. '):'Hola. ';
  const fill=s=>s.replace(/\{n\}/g,name||'');
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  let token=0;
  const STEPS=['hook','name','v1','v2','v3','v4','plan','faq','agenda','done'];
  function progress(id){const i=STEPS.indexOf(id);if(i>=0)$('prog').style.width=((i+1)/STEPS.length*100)+'%';}
  function scrollEnd(){requestAnimationFrame(()=>{chat.scrollTop=chat.scrollHeight});}
  function scrollTo(el){requestAnimationFrame(()=>{const top=el.offsetTop-80;chat.scrollTop=Math.max(0,top)});}

  async function say(items,t){
    for(const it of items){
      if(t!==token)return false;
      const typing=document.createElement('div');typing.className='typing';typing.innerHTML='<i></i><i></i><i></i>';col.appendChild(typing);scrollEnd();
      $('status').textContent='escribiendo…';
      const len=typeof it==='string'?it.replace(/<[^>]+>/g,'').length:60;
      await wait(Math.min(1500,420+len*14));
      typing.remove();if(t!==token)return false;
      $('status').textContent='en línea';
      const m=document.createElement('div');
      if(typeof it==='string'){m.className='msg bot';m.innerHTML=fill(it);col.appendChild(m);scrollEnd();}
      else{m.className='msg bot wide';col.appendChild(m);it(m);scrollTo(m);}
      await wait(220);
    }
    return true;
  }
  function me(text){const m=document.createElement('div');m.className='msg user';m.textContent=text;col.appendChild(m);scrollEnd();}
  function choices(list){
    dock.innerHTML='';
    list.forEach(([label,cls,fn],i)=>{const b=document.createElement('button');b.type='button';b.className='choice '+(cls||'main');b.style.animationDelay=(i*.08)+'s';b.innerHTML=label;
      b.addEventListener('click',()=>{dock.innerHTML='';me(b.textContent.trim());fn();});dock.appendChild(b);});
  }
  function clearDock(){dock.innerHTML='';}

  /* ---------- widgets ---------- */
  const W={
    trust(el){el.innerHTML='<div class="trust"><div><b>4</b><small>Pilares del ecosistema</small></div><div><b>17</b><small>Programas</small></div><div><b>®</b><small>Marca registrada de la academia</small></div></div>';},
    journey(el,cur){const L=['Empresa','Estrategia','Números','Ecosistema'];el.innerHTML='<div class="journey">'+L.map((l,i)=>`<div class="${i===cur?'on':i<cur?'ok':''}"><b>${i<cur?'✓':i+1}</b><small>${l}</small></div>`).join('')+'</div>';},
    cards(el,done){
      el.innerHTML=`<div class="cards">
      <button class="card" data-i="0" type="button"><div class="ch"><span class="num">1</span><span class="ct">Tu tabla tiene 6 lugares</span><span class="tap">TOCA</span></div>
        <div class="cb"><div class="tbl">${['Socio 1','Lugar','Lugar','Socio 2','Lugar','Lugar'].map((t,i)=>`<div class="row${i===0||i===3?'':' sub'}" style="animation-delay:${[0,1.6,2,.8,2.4,2.8][i]}s">${t}</div>`).join('')}</div>
        <div class="lvlup">▲ SUBES DE NIVEL</div><p>Cuando se llenan los <b>6 lugares</b>, avanzas al siguiente nivel. Son 11 niveles en total.</p></div></button>
      <button class="card" data-i="1" type="button" disabled><div class="ch"><span class="num">2</span><span class="ct">Recibes clones de regalo</span><span class="tap">TOCA</span></div>
        <div class="cb"><div class="gifts">${Array.from({length:16},(_,i)=>`<i class="gift" style="animation-delay:${.1+i*.09}s"></i>`).join('')}</div>
        <p>Desde el nivel 2, recibes <b>clones</b>: posiciones tuyas que <b>llenan lugares por ti</b>. Con la estrategia completa son <b>128 clones</b>.</p></div></button>
      <button class="card" data-i="2" type="button" disabled><div class="ch"><span class="num">3</span><span class="ct">Tu meta: nivel 5, luego 6 y 7</span><span class="tap">TOCA</span></div>
        <div class="cb"><div class="stairs">${[18,30,44,60,76,90,100].map((h,i)=>`<div class="s" style="--h:${h}%;--c:${i===4?'#9ef01a':i>4?'#7fd3a8':'#7acb16'};animation-delay:${i*.15}s">${i+1}${i===4?'<span class="flag" style="animation-delay:1.3s">META 1</span>':''}${i===6?'<span class="flag" style="animation-delay:1.7s;background:#7fd3a8">META 2</span>':''}</div>`).join('')}</div>
        <p>Con 487 empiezas en los niveles <b>1, 3, 4 y 5</b>. Con tus 6 socios y tus clones subes al <b>6 y al 7</b>, y tus clones siguen el mismo camino, <b>una y otra vez</b>.</p></div></button></div>`;
      const cs=[...el.querySelectorAll('.card')];let opened=0;
      cs.forEach((c,i)=>c.addEventListener('click',()=>{if(c.classList.contains('open')||c.disabled)return;c.classList.add('open');opened++;
        if(cs[i+1]){setTimeout(()=>{cs[i+1].disabled=false;},900);}
        setTimeout(()=>{c.scrollIntoView({behavior:'smooth',block:'nearest'});},80);
        if(opened===3)setTimeout(done,2600);}));
    },
    video(el,src,poster,dur,cap,onNear){
      el.innerHTML=`<div class="vwrap"><video playsinline preload="metadata" poster="${poster}"><source src="${src}" type="video/mp4"></video><button class="play" type="button" aria-label="Reproducir video"><div class="disc"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M8 5l12 7-12 7z" fill="#0b1306"/></svg></div><span>TOCA PARA VER · CON SONIDO</span></button><div class="vbar"><i></i></div></div><div class="vcap">${cap}</div>`;
      const v=el.querySelector('video'),pb=el.querySelector('.play'),bar=el.querySelector('.vbar i');let fired=false;
      pb.addEventListener('click',()=>{document.querySelectorAll('video').forEach(o=>{if(o!==v)o.pause()});v.muted=false;const p=v.play();if(p&&p.catch)p.catch(()=>{v.controls=true});});
      v.addEventListener('play',()=>pb.classList.add('hide'));
      v.addEventListener('pause',()=>{if(!v.ended)pb.classList.remove('hide')});
      v.addEventListener('click',()=>{if(!v.paused)v.pause()});
      v.addEventListener('timeupdate',()=>{const d=v.duration||dur;bar.style.width=(v.currentTime/d*100)+'%';if(!fired&&v.currentTime/d>.8&&onNear){fired=true;onNear();}});
      v.addEventListener('ended',()=>{pb.classList.remove('hide');pb.querySelector('span').textContent='VER DE NUEVO';if(!fired&&onNear){fired=true;onNear();}});
    },
    plan(el){el.innerHTML=`<div class="plan">
      <div class="step"><span class="n">1</span><div><strong>Activa tu estrategia con 487</strong><small>Te posicionas hasta el nivel 5. <em>La hacemos juntos.</em></small></div></div>
      <div class="step"><span class="n">2</span><div><strong>Invita a 6 personas</strong><small>A hacer la misma estrategia. <em>Te damos el guion y los videos.</em></small></div></div>
      <div class="step"><span class="n">3</span><div><strong>Sigue tu plan de 30 días</strong><small>Con el Sistema AUREX: herramientas, CRM y comunidad. <em>Te llevamos de la mano.</em></small></div></div></div>`;},
    faq(el){el.innerHTML=`<div class="faq">
      <details open><summary>Nunca he pagado en USDT, ¿cómo lo hago?</summary><p>Tranquilo, <b>lo hacemos juntos</b> en una videollamada de 15 minutos: te mostramos dónde comprar tus USDT y cómo hacer la activación paso a paso.</p></details>
      <details><summary>¿Y si no consigo a mis 6 socios?</summary><p>Tu posición y tus clones siguen en la estructura, pero <b>tu avance depende de que se llenen tus lugares</b>: con menos socios, avanzas más lento. Por eso tienes el plan de acción, los videos y la comunidad para ayudarte.</p></details>
      <details><summary>¿Es confiable?</summary><p>Su academia, Magic Lime Academy, es una <b>marca registrada</b> ante el Servicio Federal de Propiedad Intelectual de Rusia (registro n.º 970925, vigente hasta 2032). Aun así, <b>toda participación implica riesgos</b>: por eso te explicamos todo antes y no te pedimos nada sin que lo entiendas.</p></details>
      <details><summary>¿De dónde salen los pagos?</summary><p>De las <b>aportaciones de las posiciones de cada estructura</b>, como viste en el video de los números. Por eso <b>todo avanza mientras haya flujo en la comunidad</b>.</p></details>
      <details><summary>¿Hay mensualidades?</summary><p>No. Es una <b>aportación única</b> en USDT (TRC20) más comisiones de red. Sin mensualidad de membresía.</p></details></div>`;},
    ask(el){el.innerHTML=`<a class="cta ghost" href="${wa(hi()+'Vi la estrategia de 487 y tengo una pregunta antes de activar.')}" target="_blank" rel="noopener noreferrer">Escribir mi pregunta por WhatsApp ↗</a>`;},
    scheduler(el,done){
      el.innerHTML=`<div class="sch"><h4>¿QUÉ DÍA?</h4><div class="opts" data-g="d"><button class="opt" type="button" data-v="hoy">Hoy</button><button class="opt" type="button" data-v="mañana">Mañana</button></div>
      <h4>¿EN QUÉ HORARIO?</h4><div class="opts three" data-g="h"><button class="opt" type="button" data-v="en la mañana">Mañana<small>9 a 12</small></button><button class="opt" type="button" data-v="en la tarde">Tarde<small>12 a 6</small></button><button class="opt" type="button" data-v="en la noche">Noche<small>6 a 9</small></button></div>
      <a class="cta off" href="#" target="_blank" rel="noopener noreferrer">Apartar mi activación →</a><div class="seat"><i></i>Videollamada de 15 minutos · sin costo</div></div>`;
      let d='',h='';const cta=el.querySelector('.cta');
      el.querySelectorAll('.opts').forEach(g=>g.addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b)return;g.querySelectorAll('.opt').forEach(o=>o.classList.toggle('on',o===b));
        if(g.dataset.g==='d')d=b.dataset.v;else h=b.dataset.v;
        if(d&&h){cta.classList.remove('off');cta.href=wa(hi()+'Vi la estrategia de 487 y quiero agendar mi activación acompañada. Prefiero '+d+' '+h+'.');}}));
      cta.addEventListener('click',()=>{if(cta.classList.contains('off'))return;store.set('lime_slot',d+' '+h);setTimeout(()=>done(d,h,cta.href),700);});
    },
    done(el,d,h){el.innerHTML=`<div class="ok"><div class="m"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0b1306" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></div><strong>Activación apartada: ${d} ${h}</strong></div>
      <p style="margin:0 0 10px;color:#dbe4d6;font-size:14.5px">Para llegar listo a tu videollamada:</p>
      <ul class="prep"><li>Envía el mensaje que se abrió en WhatsApp para confirmar tu horario.</li><li>Ten tu celular con datos y a la mano 487 USD más comisiones.</li><li>Tu líder te dirá qué app usar para comprar tus USDT. No compres nada antes.</li></ul>`;},
  };

  /* ---------- flujo ---------- */
  async function run(id){
    const t=++token;progress(id);clearDock();
    if(id==='hook'){
      if(!await say(['Hola 👋','Te voy a presentar <b>Lime Company</b> en 4 videos cortos: la empresa, la estrategia, los números y el ecosistema.',el=>W.trust(el),'¿Empezamos?'],t))return;
      choices([['Sí, empecemos →','main',()=>run('name')]]);
    }
    if(id==='name'){
      if(!await say(['¡Perfecto! Para hablarte por tu nombre: ¿cómo te llamas?'],t))return;
      dock.innerHTML=`<form class="namebox" id="nf"><input id="nm" type="text" maxlength="30" autocomplete="given-name" placeholder="Escribe tu nombre" aria-label="Tu nombre" value="${name.replace(/"/g,'')}"><button type="submit" aria-label="Enviar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></form><button class="choice alt" id="skip" type="button" style="min-height:44px;font-size:14px">Prefiero no decirlo</button>`;
      const nm=$('nm');setTimeout(()=>{try{nm.focus({preventScroll:true})}catch(e){}},50);
      $('nf').addEventListener('submit',e=>{e.preventDefault();let v=nm.value.trim().replace(/\s+/g,' ').slice(0,30);if(!v){nm.focus();return;}v=v.charAt(0).toUpperCase()+v.slice(1);name=v;store.set('lime_name',v);clearDock();me(v);run('v1');});
      $('skip').addEventListener('click',()=>{name='';clearDock();me('Prefiero no decirlo');run('v1');});
    }
    const VIDS={v1:[0,'assets/video1.mp4','assets/poster1.jpg',117,'Video 1 de 4 · Conoce Lime Company · 1:57',[name?'Mucho gusto, {n} 🙌':'¡Va! 🙌','Este es tu recorrido:',el=>W.journey(el,0),'Empezamos por lo básico: <b>qué es Lime Company</b> y cómo se entra.'],'Siguiente: la estrategia →','v2'],
      v2:[1,'assets/video2.mp4','assets/poster2.jpg',178,'Video 2 de 4 · La estrategia de 487 · 2:58',[el=>W.journey(el,1),'Ahora la parte que más le gusta a la comunidad: <b>la estrategia de 487</b>.'],'Siguiente: los números →','v3'],
      v3:[2,'assets/video3.mp4','assets/poster3.jpg',234,'Video 3 de 4 · El modelo por dentro · 3:54',[el=>W.journey(el,2),'¿De dónde sale cada número? Aquí lo vemos <b>dólar por dólar</b>, nivel por nivel.'],'Siguiente: el ecosistema →','v4'],
      v4:[3,'assets/video4.mp4','assets/poster4.jpg',119,'Video 4 de 4 · Ecosistema Lime · 1:58',[el=>W.journey(el,3),'Por último: <b>qué hay detrás</b>. La academia, los programas y el respaldo.'],'Ya lo vi, continuar →','plan']};
    if(VIDS[id]){const [k,src,poster,dur,cap,intro,label,nxt]=VIDS[id];
      let shown=false;const next=()=>{if(shown||t!==token)return;shown=true;choices([[label,'main',()=>run(nxt)]]);};
      if(!await say([...intro,el=>W.video(el,src,poster,dur,cap,next)],t))return;
      setTimeout(()=>{if(t===token&&!shown)choices([['Saltar al siguiente →','alt',()=>run(nxt)]]);},30000);
    }
    if(id==='plan'){
      if(!await say([el=>W.journey(el,4),(name?'¡Recorrido completo, {n}! ':'¡Recorrido completo! ')+'En resumen, tu plan son <b>3 acciones</b>:',el=>W.plan(el),'¿Te ves haciendo estas 3 acciones, con nuestro acompañamiento?'],t))return;
      choices([['Sí, me veo 🙌','main',()=>run('faq')],['Tengo dudas','alt',()=>{faqMode='doubt';run('faq')}]]);
    }
    if(id==='faq'){
      const intro=faqMode==='doubt'?'Es normal tener dudas. Estas son las que casi todos tienen:':(name?'¡Me encanta, {n}!':'¡Me encanta!')+' Antes de apartar tu lugar, estas son las dudas que casi todos tienen:';
      faqMode='';
      if(!await say([intro,el=>W.faq(el)],t))return;
      choices([['Ya no tengo dudas →','main',()=>run('agenda')],['Tengo otra pregunta','alt',async()=>{const t2=++token;if(await say(['Claro. Escríbenos y te respondemos personalmente:',el=>W.ask(el)],t2))choices([['Seguir con mi activación →','main',()=>run('agenda')]]);}]]);
    }
    if(id==='agenda'){
      if(!await say(['Último paso: <b>agenda tu activación acompañada</b>.','En una videollamada de 15 minutos hacemos juntos tu activación, paso a paso, <b>incluido el pago en USDT</b>. Así no te equivocas.',el=>W.scheduler(el,(d,h,href)=>{if(t===token)finish(d,h,href)})],t))return;
    }
  }
  let faqMode='';
  async function finish(d,h,href){
    const t=++token;progress('done');
    me('Apartar '+d+' '+h);
    if(!await say([(name?'¡Listo, {n}!':'¡Listo!')+' Tu lugar está apartado 💚',el=>W.done(el,d,h)],t))return;
    const legal=document.createElement('p');legal.className='legal';legal.textContent='Presentación informativa de una comunidad independiente; no es una página oficial de Lime Company. La participación, las criptomonedas y los negocios digitales implican riesgos, incluida la posible pérdida de la aportación. Los niveles no equivalen a ingresos asegurados. No constituye asesoría financiera ni de inversión.';col.appendChild(legal);
    dock.innerHTML='<a class="choice alt" href="'+href+'" target="_blank" rel="noopener noreferrer" style="text-decoration:none">¿No se abrió WhatsApp? Ábrelo aquí ↗</a>';
  }
  $('restart').addEventListener('click',()=>{token++;col.innerHTML='<div class="day">HOY</div>';clearDock();run('hook');});
  run('hook');
})();
</script>
